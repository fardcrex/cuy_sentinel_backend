version: "3.8"

networks:
  sentinel:
    driver: bridge

volumes:
  patroni1_data:
  patroni2_data:
  etcd_data:

services:
  # ─── Servicios SNMP existentes ─────────────────────────────
  passbolt:
    build:
      context: .
      dockerfile: Dockerfile.snmp
    container_name: passbolt
    networks: [sentinel]
    ports:
      - "8080:80"
      - "1161:161/udp"

  chkmonitor:
    build:
      context: .
      dockerfile: Dockerfile.snmp
    container_name: chkmonitor
    networks: [sentinel]
    ports:
      - "8081:80"
      - "2161:161/udp"

  # ─── etcd (consenso Patroni) ────────────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: etcd
    networks: [sentinel]
    environment:
      ETCD_NAME: etcd0
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: etcd0=http://etcd:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: sentinel-etcd-token
      ALLOW_NONE_AUTHENTICATION: "yes"
    volumes:
      - etcd_data:/etcd-data
    ports:
      - "2379:2379"

  # ─── Patroni nodo 1 (primary inicial) ──────────────────────
  patroni1:
    build:
      context: ./patroni
      dockerfile: Dockerfile
    container_name: patroni1
    networks: [sentinel]
    environment:
      PATRONI_CONFIGURATION: /etc/patroni/patroni.yml
    volumes:
      - ./patroni/patroni1.yml:/etc/patroni/patroni.yml:ro
      - patroni1_data:/data/patroni
    ports:
      - "5434:5432"
      - "8008:8008"
    depends_on:
      - etcd

  # ─── Patroni nodo 2 (replica inicial) ──────────────────────
  patroni2:
    build:
      context: ./patroni
      dockerfile: Dockerfile
    container_name: patroni2
    networks: [sentinel]
    environment:
      PATRONI_CONFIGURATION: /etc/patroni/patroni.yml
    volumes:
      - ./patroni/patroni2.yml:/etc/patroni/patroni.yml:ro
      - patroni2_data:/data/patroni
    ports:
      - "5435:5432"
      - "8009:8008"
    depends_on:
      - etcd

  # ─── HAProxy (single-endpoint) ─────────────────────────────
  haproxy:
    image: haproxy:2.8
    container_name: haproxy
    networks: [sentinel]
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5432:5432"
      - "5433:5433"
      - "7000:7000"
    depends_on:
      - patroni1
      - patroni2

  # ─── Node.js API ───────────────────────────────────────────
  node_api:
    build:
      context: ./node_api
    container_name: node_api
    networks: [sentinel]
    environment:
      PG_HOST: haproxy
      PG_PORT: 5432
      PG_DATABASE: postgres
      PG_USER: app
      PG_PASSWORD: app_secret_2025
      JWT_SECRET: cuy_sentinel_jwt_secret_2025
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - haproxy

  # ─── Go collector ──────────────────────────────────────────
  go_collector:
    build:
      context: ./go_collector
    container_name: go_collector
    networks: [sentinel]
    environment:
      PG_DSN: "postgres://app:app_secret_2025@haproxy:5432/postgres?sslmode=disable"
      SNMP_INTERVAL: "300"
    depends_on:
      - haproxy
      - passbolt
      - chkmonitor
